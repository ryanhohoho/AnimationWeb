<!doctype html>
<meta charset="utf-8">
<!-- without this a narrow window silently lays out at the legacy 980px
     fallback viewport, so the two SMALL breakpoints would be checked at the
     wrong cell size and quietly report a pass they never earned. -->
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>portrait look pass — breakpoint check</title>
<!--
  tools/preview/portrait.html -- the look pass's browser check (bible 4.5, 9).

  WHY THIS EXISTS RATHER THAN A SCREENSHOT OF THE SITE. The portrait is baked
  (phase 7's tooling half) but not yet composited into the page -- nothing in
  src/ imports src/type/portrait.js, because the hero's layout is a later step.
  So there is no route to point a browser at that would show this element, and
  "verify in the browser" has to mean verifying the shipped asset the way the
  site will read it: same bytes, same module, same ramp atlas, same two inks,
  at each of the five breakpoints' cell sizes.

  It deliberately uses the REAL src/type/portrait.js player and the REAL
  src/config/siteConfig.js rather than reimplementing either. That makes this a
  genuine end-to-end check of the new pack format: if the fringe flag or the
  palette had broken the transport, this page would not draw. It also means
  this file has no numbers of its own -- every cell size, colour and fps below
  is read out of the config.
-->
<style>
  :root { color-scheme: light; }
  body {
    margin: 0; background: #F4F2EC; color: #12100F;
    font: 400 11px/1.5 "IBM Plex Mono", ui-monospace, monospace;
  }
  header { padding: 8px 10px; border-bottom: 1px solid rgba(18,16,15,.15); }
  header b { font-weight: 600; }
  #stage { display: flex; justify-content: center; padding: 10px 0 16px; }
  canvas { image-rendering: pixelated; display: block; }
  #meta { padding: 0 10px 10px; opacity: .7; }
</style>
<header>
  <b id="bp">—</b> <span id="dims"></span>
</header>
<div id="stage"><canvas id="c"></canvas></div>
<div id="meta"></div>

<script type="module">
import { siteConfig } from "/src/config/siteConfig.js";
import { createPortraitPlayer, createPortraitBuffer, loadPortraitPack }
  from "/src/type/portrait.js";

const ramp = await (await fetch("/src/assets/ramp.json")).json();
const { header, packed } = await loadPortraitPack(
  "/src/assets/portrait.json", "/src/assets/portrait.bin");

// the atlas ships as ink-on-black luminance. The page is ink on PAPER, so each
// ink gets its own pre-tinted copy: colour everywhere, alpha from the atlas.
// Three of them -- the ink and the two fringe inks -- because bible 3.3's
// chromatic whisper is a different INK, not a different opacity.
const atlasImg = await new Promise((res, rej) => {
  const im = new Image();
  im.onload = () => res(im); im.onerror = rej;
  im.src = "/src/assets/ramp.png";
});
function tint(hex) {
  const cv = document.createElement("canvas");
  cv.width = atlasImg.width; cv.height = atlasImg.height;
  const cx = cv.getContext("2d", { willReadFrequently: true });
  cx.drawImage(atlasImg, 0, 0);
  const d = cx.getImageData(0, 0, cv.width, cv.height);
  const r = parseInt(hex.slice(1, 3), 16), g = parseInt(hex.slice(3, 5), 16),
        b = parseInt(hex.slice(5, 7), 16);
  for (let i = 0; i < d.data.length; i += 4) {
    d.data[i + 3] = d.data[i];      // luminance -> alpha
    d.data[i] = r; d.data[i + 1] = g; d.data[i + 2] = b;
  }
  cx.putImageData(d, 0, 0);
  return cv;
}
const INKS = [tint(siteConfig.color.ink), tint(siteConfig.color.fringeA),
              tint(siteConfig.color.fringeB)];

// the breakpoint whose cell size this viewport gets, straight out of the
// config's own descending table -- the first band the width clears.
function bandFor(w) {
  return siteConfig.grid.breakpoints.find(b => w >= b.minWidth)
      || siteConfig.grid.breakpoints[siteConfig.grid.breakpoints.length - 1];
}

const [cols, rows] = header.grid;
const cellCount = cols * rows;
const buffer = createPortraitBuffer(header);
const player = createPortraitPlayer({ header, packed, buffer });
const canvas = document.getElementById("c");
const ctx = canvas.getContext("2d");
const { glyphMask, fringeBit, palette } = header;
const aw = atlasImg.width, ah = atlasImg.height;

let cw = 0, ch = 0;
function layout() {
  const band = bandFor(window.innerWidth);
  cw = band.cell.w; ch = band.cell.h;
  canvas.width = cols * cw; canvas.height = rows * ch;
  // never a fractional cell (bible 3.1): if the box overruns the viewport it
  // steps down by a WHOLE integer divisor, the same rule the grid's own
  // quantization follows, so a glyph never lands on a half pixel. Height
  // counts as well as width -- the point of this page is to judge the whole
  // element at each breakpoint, and half a portrait answers nothing.
  const availW = Math.max(1, window.innerWidth - 20);
  const availH = Math.max(1, window.innerHeight - 70);
  let div = 1;
  while (canvas.width / div > availW || canvas.height / div > availH) div++;
  canvas.style.width = (canvas.width / div) + "px";
  document.getElementById("bp").textContent =
    `viewport ${window.innerWidth}x${window.innerHeight} · band >=${band.minWidth} · cell ${cw}x${ch}`;
  document.getElementById("dims").textContent =
    `· portrait ${cols}x${rows} cells = ${canvas.width}x${canvas.height} css px` +
    (div > 1 ? ` · shown at 1/${div}` : " · shown 1:1");
  draw();
}

function draw() {
  ctx.fillStyle = siteConfig.color.paper;
  ctx.fillRect(0, 0, canvas.width, canvas.height);
  let fringed = 0;
  for (let i = 0; i < cellCount; i++) {
    const byte = buffer[i];
    const g = ramp.glyphs[palette[byte & glyphMask]];
    if (g.cov <= 0) continue;
    // WHICH fringe ink is a stable function of the cell index (bible 3.3), not
    // stored per cell and never re-rolled, so the fringe cannot crawl.
    const inkIx = (byte & fringeBit) ? 1 + (i & 1) : 0;
    if (inkIx) fringed++;
    const [u0, v0, u1, v1] = g.uv;
    ctx.drawImage(INKS[inkIx], u0 * aw, v0 * ah, (u1 - u0) * aw, (v1 - v0) * ah,
                  (i % cols) * cw, ((i / cols) | 0) * ch, cw, ch);
  }
  document.getElementById("meta").textContent =
    `frame ${player.frameIndex}/${header.frames} @ ${header.fps}fps · ` +
    `${(packed.length / 1024).toFixed(1)}KB / ${siteConfig.portrait.maxBytes / 1024}KB · ` +
    `palette ${palette.length} glyphs · fringe ${(fringed / cellCount * 100).toFixed(2)}% ` +
    `(ceiling ${siteConfig.fringe.maxCellFraction * 100}%) · ` +
    `mean ink ${header.meanCoverage} · empty ${header.emptyFraction} · ` +
    `midtone ${header.midtoneFraction} · heavy ${header.heavyFraction}`;
}

// a ResizeObserver rather than only a resize listener: the first layout can
// run before the viewport has a size (a headless capture reports 0x0 for a
// tick), and a page that measured the viewport once and believed it would
// render the wrong breakpoint forever.
new ResizeObserver(layout).observe(document.documentElement);
addEventListener("resize", layout);
layout();

let last = performance.now();
(function tick(now) {
  if (player.update((now - last) / 1000)) draw();
  last = now;
  requestAnimationFrame(tick);
})(last);

// a hook for the screenshot pass: park on a known frame so five breakpoint
// captures are of the SAME frame and differ only in cell size.
window.__portraitSeek = (i) => {
  player.reset();
  for (let k = 0; k < i; k++) player.update(1 / header.fps);
  draw();
};
window.__portraitReady = true;
</script>
