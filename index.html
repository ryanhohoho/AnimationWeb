<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="color-scheme" content="light" />
  <title>Ryan Ho</title>

  <!--
    SCAFFOLD ONLY. Every placeholder section, card and colour that used to live
    here is gone. What is left is the LAYER CONTRACT the whole site is built on,
    and it is worth understanding before adding anything:

      #doc     real DOM. Real headings, real links, real paragraphs, laid out by
               the browser. It is the LAYOUT ENGINE and the ACCESSIBILITY LAYER.
               Its text is `color: transparent` -- NOT hidden, NOT aria-hidden --
               so it still reflows, still measures, still takes focus, still gets
               read by a screen reader, and still selects with the cursor.
      #stage   one canvas, one WebGL context, for the lifetime of the session.
               It paints what #doc means: the ASCII type field, and mew on top.
               Never recreated on navigation. See DESIGN_BIBLE.md.

    So: the browser does layout, we do paint. Nothing here draws itself.
    Read DESIGN_BIBLE.md first, then IMPLEMENTATION_PLAN.md.
  -->
  <style>
    :root {
      /* placeholders for the real tokens -- see DESIGN_BIBLE.md section 3.
         deliberately neutral so nothing inherits the old pink/lavender look. */
      --paper: #f4f2ec;
      --ink: #12100f;
      --cell-w: 7px;
      --cell-h: 12px;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      background: var(--paper);
      color: var(--ink);
      font-family: ui-monospace, "SFMono-Regular", Menlo, monospace;
      overflow-x: hidden;
      -webkit-text-size-adjust: 100%;
    }

    /* the semantic layer. present, measurable, focusable, readable by AT --
       just not painted by the browser. the canvas paints it instead. */
    #doc { position: relative; z-index: 1; }
    #doc :is(h1, h2, h3, p, a, li, span) { color: transparent; }
    /* ...but keyboard focus must still be visible, because the canvas cannot
       know about it in time. */
    #doc a:focus-visible { outline: 2px solid var(--ink); outline-offset: 4px; }

    /* one canvas, fixed, never rebuilt. pointer-events:none so every click,
       hover and selection lands on the real DOM underneath. */
    #stage {
      position: fixed; inset: 0; width: 100vw; height: 100vh;
      pointer-events: none; z-index: 2;
    }

    /* no-JS / no-WebGL fallback: stop hiding the text. */
    .no-paint #doc :is(h1, h2, h3, p, a, li, span) { color: var(--ink); }
    .no-paint #stage { display: none; }
  </style>
</head>
<body class="no-paint">
  <div id="doc">
    <!-- routes render here. nothing is authored inline any more. -->
    <main id="route-outlet"></main>
  </div>

  <canvas id="stage"></canvas>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
