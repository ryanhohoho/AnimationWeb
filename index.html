<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <!-- viewport-fit=cover so the sheet reaches the physical screen edge on a
       notched phone; every fixed control then insets itself with
       env(safe-area-inset-*) rather than the whole page being letterboxed
       in paper-coloured bars. No maximum-scale: pinch zoom stays. -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="color-scheme" content="light" />
  <title>RYAN HO</title>
  <meta name="description" content="Ryan Ho — systems developer. Undocumented file formats, hardware automation, and a procedurally animated Mew loose on the page." />
  <meta name="theme-color" content="#FFFFFF" />
  <meta name="author" content="Ryan Ho" />

  <!-- THE TAB MARK. Her, in bone, on the one ink no project may own — which is
       the disc idiom and every window on this sheet said in 32 pixels. Cut from
       src/assets/media/"mew icon.png" by tools/bake_favicon.mjs; the svg is the
       same 32×32 grid as merged horizontal runs, so it is the mark itself and
       not a rendering of it. The png is there for the browsers that will not
       take an svg, and 192 is the size a phone wants for a home-screen tile.
       No 16: at that size her tail is a dashed line. -->
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <link rel="icon" href="/favicon-32.png" sizes="32x32" type="image/png" />
  <link rel="apple-touch-icon" href="/favicon-192.png" />

  <!-- ══ THE LINK CARD ═══════════════════════════════════════════════════════
       A shared link is the only part of this site most people will ever see,
       and it is seen at about 500 px wide in somebody else's feed. So the card
       is SET rather than captured (tools/bake_og.mjs): a screenshot of the
       sheet at that size is a grey rectangle, because the halftone dissolves,
       the display type is unreadable and the animal is 40 px of pink.

       THE PATHS ARE RELATIVE, AND THAT IS A KNOWN COMPROMISE. og:image is
       specified as absolute, and most scrapers — Slack, Discord, iMessage,
       LinkedIn, Twitter — resolve a relative one against the page anyway. A
       WRONG absolute origin is worse than a relative path, and this repo does
       not know its own domain yet: there is no deploy config in it. When there
       is one, make these absolute and add a canonical link beside them. -->
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="Ryan Ho" />
  <meta property="og:title" content="Ryan Ho — systems developer" />
  <meta property="og:description" content="Undocumented file formats, and the hardware nobody wants to do by hand. Portfolio, printed as a two-ink riso sky seen through die-cut apertures." />
  <meta property="og:image" content="/og.png" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta property="og:image:alt" content="Bone paper with a rectangle cut out of it, and Mew standing in the hole in cerulean." />
  <meta name="twitter:card" content="summary_large_image" />

  <!-- THE ONE RULE THAT NEEDS TO NOT BE IN THE STYLESHEET. `body class="pre"`
       below holds #doc at opacity 0 until main.js has built the deck, so the
       type fades up with the print rather than flashing ahead of it — and with
       scripting off nothing ever removes it, so this whole summary card sits in
       the source and renders as blank paper. It is a <noscript> and not a media
       query because "has JavaScript" is not a thing CSS can ask.

       The other half of the answer — a script that loads and then throws — is a
       timed animation in site.css, because that case still runs CSS.

       !important, AND IT HAS TO BE. This block and the stylesheet rule it is
       overriding have the SAME specificity, so the winner is whichever comes
       last — and the bundler decides that, not this file: Vite injects its
       <link rel="stylesheet"> at the foot of <head>, forty lines below here.
       Measured in dist/index.html, where the noscript lands on line 59 and the
       stylesheet on 104. Raising the selector instead would be a specificity
       trick that reads like an accident; this says what it is doing. -->
  <noscript><style>body.pre #doc { opacity:1 !important; animation:none !important; }</style></noscript>
  <!--
    Read RYAN.txt first, then DESIGN.md.

    THE OBJECT
    ==========
    This page is two sheets of paper and one animal.

      SHEET 1 · THE PLATE  a two-ink riso print of a sky, running from last
                           light at the top of the document to full night at
                           the bottom, with real weather moving slowly in it on
                           a seamless loop. It is drawn by one fragment shader
                           (src/site/pressgl.js) from a 120 KB density sheet
                           baked off a cloud clip (src/site/skyclip.js). The
                           clouds move; the dots do not, because the halftone
                           lattice is a property of the PAPER and is computed
                           from document position.

      SHEET 2 · THE MASK   white stock, die-cut. It is everything you are
                           reading. Type NEVER sits on the print -- the print is
                           only ever visible through a hole -- which is what
                           makes this legible where three earlier grounds were
                           not. The paper is painted by the same shader, so
                           there is one surface here, not two stacked ones.

      THE ANIMAL           Mew. Not a mascot and not a cursor effect: the one
                           thing on the page that is not printed. She is also
                           the only thing that can open the sheet without a die
                           -- she carries a soft hole with her, cut by the same
                           shader from the same field, so it shows the same
                           moving weather as every other hole. That is the whole
                           argument of the site stated as a mechanism rather
                           than as a sentence.

    IT IS ONE SHEET. Not five. The sections are numbered because they are
    sections, and the header carries how far down the sheet you are in real
    document pixels -- which is the honest way to say "this is continuous", and
    it is measured at runtime rather than typed in.

    Nothing here is decorated. Everything is LABELLED, and every label is TRUE.
    The screen angles, the ruling, the misregistration and the percentages are
    the constants the renderer actually uses. Fake metadata as composition is
    his move; real metadata as composition is the same move, kept honest.
  -->
</head>
<body class="pre">
  <!-- THE SHEET. One fixed canvas, behind everything, that paints the paper AND
       the print AND every hole cut in the paper in a single pass (site/pressgl.js).
       Outside a hole it outputs flat white stock; inside one it outputs the
       two-ink print at that DOCUMENT position, so a hole stays registered to the
       page while the page scrolls under the window.

       The paper is NOT a DOM layer with holes masked out of it. A mask over a
       dozen rectangles is a compositing problem that behaves differently in
       every browser; this is just what the shader returns where the fragment is
       not inside a hole. The apertures below are therefore empty divs -- they
       carry their registration ticks and their position, and nothing else. -->
  <canvas id="sheet" aria-hidden="true"></canvas>

  <!-- THE EATING, on its own layer above the words. The page used to fade out
       when you clicked a project, which meant the transition happened to an
       empty screen; now the sheet stays exactly where it is and the opening
       spreads OVER it. Transparent and idle except during a crossing. -->
  <canvas id="eat" aria-hidden="true"></canvas>

  <!-- tabindex="-1" so the router can move focus here after a swap. It is not in
       the tab order; it is a place to PUT focus. Without it, replacing #doc
       detaches whatever was focused and a keyboard reader is dropped back at the
       top of the browser chrome on every navigation. -->
  <main id="doc" tabindex="-1">

    <!-- ══ 01 · SUMMARY ══════════════════════════════════════════════════════
         THE ONE CARD THAT KEEPS ITS WINDOW.

         Every other card on the deck carries ONE small round cut above its own
         name -- a lens, and the only circle on a sheet whose every other die-cut
         is a rectangle. This one keeps a whole tall slot right of centre,
         because it is where the reader is taught what a hole in this sheet IS:
         the sun is off the top-right of the print, so this aperture holds the
         last warm light, and pressing on to the next card opens it and takes
         them through it. After that they know, and the rest of the deck can
         turn like pages.

         (The horizon band that used to run along the foot of every other card
         is gone, by instruction. The lens replaced it: a band at the bottom of
         a one-screen card is a footer, and a footer is furniture.)

         Type in ONE column, left-aligned and centred in the page, with the hour
         alone in the top-right corner. NOTHING HERE IS A COLLIDER any more --
         she passes through the words now, which is why the composition can be
         this tight without ever trapping her. -->
    <section class="plate deckpage" id="s0" data-node="01">
      <div class="corner tr deck-hour">
        <p class="t dim">01</p>
        <p class="t">19:00</p>
      </div>

      <div class="deck-in">
        <p class="t dim eye" style="--i:0">RYAN&nbsp;HO&nbsp;·&nbsp;PORTFOLIO</p>
        <p class="t dim greet" style="--i:1">hi, i'm</p>
        <h1 class="d name" style="--i:2">ryan ho</h1>
        <p class="t body bio" style="--i:3">Software Engineer for the RCMP</p>
        <p class="t body bio" style="--i:4">I study Computer Science and Biology at <em>UBC</em>.&nbsp;</p>
        <!-- THE SAME KEY, TAUGHT ONCE. This read "press → to continue" in
             body copy, while the corner taught the identical control in a
             different vocabulary two hundred pixels away -- one instruction,
             given twice, in two costumes. The keycap here IS the corner's
             keycap, so the reader learns one object; and the whole line stays a
             link, so pressing the key and clicking the sentence do the same
             thing. The label carries the words for a screen reader, because the
             cap is a picture of a key rather than the word for one.

             The words carry the underline, not the anchor: a rule that runs
             under the cap as well makes the key look struck through, and
             dropping the underline altogether would leave colour alone doing
             the work of saying this is a link. -->
        <p class="t dim hint" style="--i:6"><a class="link hint-a" href="/experience" data-route
             aria-label="Press the right arrow key to continue"><span class="hint-w">press</span> <span class="keycap keycap-in" aria-hidden="true"><svg viewBox="0 0 16 16"><path d="M3.5 8h8M8 4.5 11.5 8 8 11.5" /></svg></span> <span class="hint-w">to continue</span></a></p>
      </div>

      <!-- THE WINDOW. The crossing to the next card opens out of exactly this
           rectangle, because holeOf() falls back to the first aperture in the
           plate and this is it.

           IT CARRIES NO CAPTION ANY MORE. "AP. 01 — LAST LIGHT" was labelling
           the PRESS, and the press is the same cerulean, the same trim and the
           same hour on every sheet here -- so it was the least page-specific
           thing on the page, wearing the most prominent annotation slot. A hole
           does not need to be told what it is; the sky in it is the label. -->
      <div data-e="ap-j04e" class="ap tall" data-ap style="--x:63%; --y:14%; --w:23%; --h:62%"></div>
    </section>

  </main>

  <!-- ══ THE CHROME ══════════════════════════════════════════════════════════
       Everything that does NOT turn when the page does, which is why it lives
       out here: #doc is replaced wholesale on every navigation, and navigation
       furniture that is destroyed and rebuilt once per move flickers once per
       move.

       Every control is a real <a href>. The router already delegates clicks on
       a[data-route], so this needs no JavaScript to work, survives a middle
       click, and is a correct page before a single module has loaded. -->
  <!-- WHAT CHANGED, SAID OUT LOUD. This is one document that swaps its own
       contents, so nothing about a navigation is announced: the URL changes, the
       title changes, and a screen reader is told neither. A polite live region
       is the whole fix. -->
  <p id="say" class="sr" aria-live="polite" aria-atomic="true"></p>

  <div id="chrome">
    <!-- ══ THE NAV BAR ══════════════════════════════════════════════════════
         By instruction (2026-09-25): a small bar at the top middle, about a
         third of the window wide, naming the four cards. It replaced every
         other piece of navigation furniture the sheet carried -- the two sky
         discs (home, and back to the work), the cross-stitch chart and its
         counter, the phone's arrow buttons and the corner keycaps. The arrow
         keys and the swipe still turn the deck; they are simply not advertised.

         No dropdown: a project sheet is reached from the Projects card, and on
         a project sheet the bar says you are inside PROJECTS by marking it.

         Every control is a real <a href>. The router already delegates clicks
         on a[data-route], so this needs no JavaScript to work, survives a middle
         click, and is a correct page before a single module has loaded. The
         router decides the move (router.js, transitionFor): anything to or from
         the summary, or to or from a project sheet, crosses; the rest turn. -->
    <nav class="topnav" aria-label="Sections">
      <a class="t topnav-a" href="/"           data-route data-nav="home">Summary</a>
      <a class="t topnav-a" href="/experience" data-route data-nav="experience">Experience</a>
      <a class="t topnav-a" href="/projects"   data-route data-nav="projects">Projects</a>
      <a class="t topnav-a" href="/contact"    data-route data-nav="contact">Contact</a>
    </nav>
  </div>

  <canvas id="stage" aria-hidden="true"></canvas>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
